services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: homework-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: homework
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: 1234
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:16
    container_name: homework-postgres
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: homework
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  clickhouse_data:
  postgres_data:

