version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cinema-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Mishka
      POSTGRES_DB: cinema_db
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cinema_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata: